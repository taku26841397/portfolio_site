<svg width="200" height="200" viewBox="0 0 200 200"
     xmlns="http://www.w3.org/2000/svg">

  <g id="snowflake" fill="none" stroke="#000" stroke-width="10"
     stroke-linecap="round" transform="rotate(0 100 100)">

    <!-- 中心の六角形 -->
    <polygon points="100,60 130,80 130,120 100,140 70,120 70,80" />

    <!-- 主軸（縦・横・斜め） -->
    <line x1="100" y1="20" x2="100" y2="60"/>
    <line x1="100" y1="140" x2="100" y2="180"/>

    <line x1="20" y1="100" x2="70" y2="100"/>
    <line x1="130" y1="100" x2="180" y2="100"/>

    <line x1="40" y1="40" x2="70" y2="80"/>
    <line x1="130" y1="120" x2="160" y2="160"/>

    <line x1="160" y1="40" x2="130" y2="80"/>
    <line x1="70" y1="120" x2="40" y2="160"/>

    <!-- 枝（第1段階） -->
    <line x1="100" y1="40" x2="115" y2="55"/>
    <line x1="100" y1="40" x2="85" y2="55"/>

    <line x1="100" y1="160" x2="115" y2="145"/>
    <line x1="100" y1="160" x2="85" y2="145"/>

    <line x1="40" y1="100" x2="55" y2="115"/>
    <line x1="40" y1="100" x2="55" y2="85"/>

    <line x1="160" y1="100" x2="145" y2="115"/>
    <line x1="160" y1="100" x2="145" y2="85"/>

    <!-- 枝（第2段階：追加した部分） -->
    <line x1="100" y1="70" x2="115" y2="85"/>
    <line x1="100" y1="70" x2="85" y2="85"/>

    <line x1="100" y1="130" x2="115" y2="115"/>
    <line x1="100" y1="130" x2="85" y2="115"/>

    <line x1="70" y1="100" x2="85" y2="115"/>
    <line x1="70" y1="100" x2="85" y2="85"/>

    <line x1="130" y1="100" x2="115" y2="115"/>
    <line x1="130" y1="100" x2="115" y2="85"/>

  </g>
</svg>
